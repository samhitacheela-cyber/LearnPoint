<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnPoint - Reset Password</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-page">
    <div class="login-box">
        <div class="auth-logo">LearnPoint</div>
        <p class="tagline">Learn. Practice. Grow.</p>
        <h2>Create New Password</h2>
        <p class="auth-description">Choose a new password for your account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" minlength="8" required>
            <button type="submit" class="auth-button">Reset Password</button>
        </form>
    </div>
</div>
</body>
</html>
