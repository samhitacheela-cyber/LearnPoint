<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnPoint - Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>

<body>

    <div class="auth-page">

        <div class="login-box admin-login-box">

            <div class="auth-logo"><img src="{{ url_for('static', filename='logo.png') }}" alt="LearnPoint Logo"><span>LearnPoint</span></div>

            <p class="tagline">Administrator Portal</p>

            <h2>Admin Login</h2>

            <p class="auth-description">
                Sign in to manage LearnPoint.
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin_login') }}">

                <label for="username">Admin Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    required
                >

                <label for="password">Admin Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

                <button type="submit" class="auth-button">
                    Admin Login
                </button>

            </form>

            <p class="register-link">
                <a href="{{ url_for('login') }}">
                    ← Back to User Login
                </a>
            </p>

        </div>

    </div>

</body>
</html>
